name: 'SpecPulse v2.4 Web, AI Bot Policy & HTTP Security Audit'
description: 'Audit any live domain across 20 AI bot policy (Content-Signal), SSR, SEO, and strict CSP/HSTS security checks.'
author: 'SpecPulse by Maxra Labs'
branding:
  icon: 'check-circle'
  color: 'purple'

inputs:
  url:
    description: 'Public production domain or HTTPS URL to inspect (e.g. https://example.com)'
    required: true
  fail-under:
    description: 'Minimum passing compliance score (0-100). Set to 0 for report-only mode.'
    required: false
    default: '80'

outputs:
  score:
    description: 'Measured compliance score out of 100 (or N/A if WAF-protected)'
    value: ${{ steps.audit.outputs.score }}
  grade:
    description: 'Compliance letter grade (A+, A, B, C, D, or N/A)'
    value: ${{ steps.audit.outputs.grade }}

runs:
  using: 'composite'
  steps:
    - name: Run SpecPulse v2.4 Edge Telemetry Check
      id: audit
      shell: bash
      env:
        TARGET_URL: ${{ inputs.url }}
        FAIL_UNDER: ${{ inputs.fail-under }}
      run: |
        node -e '
          const fs = await import("node:fs");
          const target = process.env.TARGET_URL;
          const threshold = Number(process.env.FAIL_UNDER || "0");
          const apiUrl = "https://specpulse.pages.dev/api/audit?url=" + encodeURIComponent(target);
          const res = await fetch(apiUrl, { headers: { "User-Agent": "SpecPulse-GitHub-Action/2.4" } });
          const data = await res.json();
          if (!res.ok || data.error) {
            console.error("SpecPulse audit error:", data.error || res.status);
            process.exit(1);
          }
          if (data.blockedByWaf) {
            console.log(`[INDETERMINATE / WAF] ${data.warning}`);
            if (process.env.GITHUB_OUTPUT) fs.appendFileSync(process.env.GITHUB_OUTPUT, "score=N/A\ngrade=N/A\n");
            process.exit(0);
          }
          const host = String(data.origin || target).replace(/^https?:\/\//, "").replace(/\/$/, "");
          const reportUrl = "https://specpulse.pages.dev/?domain=" + encodeURIComponent(host);
          console.log(`=== SpecPulse v2.4 Telemetry: ${data.origin} ===`);
          console.log(`Score: ${data.totalScore}/100 (Grade ${data.grade}) | Passed: ${data.passedCount} | Action Required: ${data.failedCount}`);
          for (const c of data.checks || []) {
            if (c.status === "fail") console.log(`  [FIX ${c.score}/${c.weight}] ${c.title} (${c.spec}) -> ${c.fixHint}`);
          }
          if (process.env.GITHUB_OUTPUT) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `score=${data.totalScore}\ngrade=${data.grade}\n`);
          }
          if (process.env.GITHUB_STEP_SUMMARY) {
            const failedRows = (data.checks || []).filter(c => c.status === "fail").map(c => `| ❌ \`${c.spec}\` | **${c.title}** | ${c.fixHint} |`).join("\n");
            const md = [
              `### SpecPulse v2.4 Telemetry — \`${data.origin}\` (**${data.totalScore}/100 · Grade ${data.grade}**)`,
              `- **Interactive Report**: [${reportUrl}](${reportUrl})`,
              failedRows ? `\n| Spec | Action Needed | Recommended Fix |\n| :--- | :--- | :--- |\n${failedRows}` : "\n✅ All 20 core checks passed."
            ].join("\n");
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          }
          if (data.totalScore < threshold) {
            console.error(`Score ${data.totalScore} is below fail-under threshold ${threshold}.`);
            process.exit(1);
          }
        '
